# .github/workflows/deploy.yml
name: Deploy Node App

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using ssh
        uses: actions/checkout@v3
        with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /services/wtfMusic
          # Pull the latest changes from the repository
          git fetch origin
          git checkout main
          git pull 
          sudo build -t music-server .
          sudo docker stop music-server-container || true
          sudo docker rm music-server-container || true
          sudo docker run -d --name music-server-container -p 3000:6969 music-server
